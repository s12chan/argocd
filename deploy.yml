apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: flight
  name: flight-deploy
spec:
  replicas: 4
  selector:
    matchLabels:
      app: flight
  template:
    metadata:
      labels:
        app: flight
    spec:
      containers:
      - name: cont1
        image: challasaichandana2000/flight:latest
        ports:
          - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: abc
spec:
  type: LoadBalancer
  selector:
    app: flight
  ports:
    - port: 80
      targetPort: 80
