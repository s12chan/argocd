apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: fashion
  name: fashion-deploy
spec:
  replicas: 4
  selector:
    matchLabels:
      app: fashion
  template:
    metadata:
      labels:
        app: fashion
    spec:
      containers:
      - name: cont1
        image: challasaichandana2000/fashion:latest
        ports:
          - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: abc
spec:
  type: LoadBalancer
  selector:
    app: fashion
  ports:
    - port: 80
      targetPort: 80
